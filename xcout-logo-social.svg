<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%"   stop-color="#0d1f30" />
      <stop offset="100%" stop-color="#080C10" />
    </radialGradient>

    <!-- gradients en espacio local del grupo (coordenadas 0-40) -->
    <linearGradient id="xg1" x1="11" y1="11" x2="29" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="48%"  stop-color="#e0faff" stop-opacity="1" />
      <stop offset="52%"  stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="xg2" x1="29" y1="11" x2="11" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="48%"  stop-color="#e0faff" stop-opacity="1" />
      <stop offset="52%"  stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.55" />
    </linearGradient>
    <radialGradient id="xglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="45%"  stop-color="#67e8f9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <filter id="glow-text" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-x" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="500" height="500" fill="url(#bg)" />

  <!-- Halo de fondo cian muy suave -->
  <circle cx="250" cy="210" r="145" fill="#22d3ee" fill-opacity="0.04" />

  <!-- X logo — escala 5× del original 40×40, centrado en (250, 210) -->
  <g transform="translate(50, 10) scale(5)">
    <!-- Anillo exterior punteado -->
    <circle cx="40" cy="40" r="17.5"
      stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.22"
      stroke-dasharray="3.5 4.5" fill="none" />
    <!-- Anillo interior -->
    <circle cx="40" cy="40" r="11.5"
      stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.10"
      fill="none" />
    <!-- Brazo \ -->
    <line x1="31.5" y1="31.5" x2="48.5" y2="48.5"
      stroke="url(#xg1)" stroke-width="2.2" stroke-linecap="round" />
    <!-- Brazo / -->
    <line x1="48.5" y1="31.5" x2="31.5" y2="48.5"
      stroke="url(#xg2)" stroke-width="2.2" stroke-linecap="round" />
    <!-- Halo central -->
    <circle cx="40" cy="40" r="6" fill="url(#xglow)" />
    <!-- Punto central -->
    <circle cx="40" cy="40" r="1.5" fill="white" fill-opacity="0.94" />
  </g>

  <!-- Texto "Xcout" -->
  <text
    x="250" y="388"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="72"
    font-weight="900"
    letter-spacing="-3"
  >
    <tspan fill="#22d3ee" filter="url(#glow-text)">X</tspan><tspan fill="white" font-weight="600" letter-spacing="-2">cout</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="250" y="428"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="18"
    font-weight="500"
    fill="#22d3ee"
    fill-opacity="0.45"
    letter-spacing="4"
  >FOOTBALL ANALYTICS</text>
</svg>
